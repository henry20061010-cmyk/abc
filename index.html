<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="api-key-section">
        <h1>Gemini API 金鑰設定</h1>
        <p>請輸入您的 Gemini API 金鑰：</p>
        <input type="password" id="api-key-input" placeholder="在此輸入您的 API 金鑰">
        <button id="save-key-button">儲存</button>
    </div>

    <div id="chat-section" class="hidden">
        <div id="chat-container"></div>
        <div id="input-container">
            <textarea id="message-input" placeholder="在這裡輸入您的訊息..."></textarea>
            <button id="send-button">傳送</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai/dist/index.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
