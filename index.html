<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="api-key-section">
        <h1>Gemini API 金鑰設定</h1>
        <p>請輸入您的 Gemini API 金鑰以開始使用。</p>
        <div class="input-group">
            <input type="password" id="api-key-input" placeholder="在此輸入您的 API 金鑰">
            <button id="save-key-btn">儲存</button>
        </div>
    </div>

    <div id="chat-section" class="hidden">
        <div class="chat-history-container">
            <div id="chat-history"></div>
        </div>
        <div class="chat-input-container">
            <textarea id="message-input" placeholder="輸入訊息..." rows="1"></textarea>
            <button id="send-btn">傳送</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
